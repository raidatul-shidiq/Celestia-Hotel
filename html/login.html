<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestia Palace - Login Resepsionis</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="icon" href="../Assets/logo.png" type="image/png" />
</head>

<body>

    <!-- Container Utama Split -->
    <div class="login-wrapper">
        
        <!-- Bagian Kiri: Gambar Hotel & Overlay -->
        <div class="login-hero">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <div class="hero-badge"> BINTANG 5 </div>
                <h1>Celestia Palace</h1>
                <p>Kemewahan & Kenyamanan<br>di Setiap Detail</p>
                <div class="hero-divider"></div>
                <div class="hero-features">
                    <span>🛎️ 24/7 Concierge</span>
                    <span>🏊 Infinity Pool</span>
                    <span>🍽️ Fine Dining</span>
                </div>
            </div>
            <div class="hero-credit">© 2026 Celestia Palace Hotel</div>
        </div>

        <!-- Bagian Kanan: Form Login -->
        <div class="login-form-wrapper">
            <div class="login-form-container">
                
                <!-- Header -->
                <div class="form-header">
                    <div class="form-icon">🛎️</div>
                    <h2>Selamat Datang</h2>
                    <p>Portal Resepsionis</p>
                    <div class="form-divider"></div>
                </div>

                <!-- Form -->
                <form id="login-form" class="login-form">
                    <div class="form-group">
                        <label for="username">
                            <span>👤</span> ID Resepsionis
                        </label>
                        <input type="text" id="username" placeholder="Masukkan username Anda" required autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="password">
                            <span>🔒</span> Password
                        </label>
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="Masukkan password Anda" required>
                            <button type="button" id="toggle-password" class="btn-toggle-pass" title="Tampilkan/Sembunyikan Password">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-login">
                        <span>Masuk ke Sistem</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </form>

                <!-- Footer (Tombol Kembali ke Beranda yang Estetik) -->
                <div class="form-footer">
                    <a href="../index.html" class="btn-back-home">← Kembali ke Beranda</a>
                </div>

            </div>
        </div>

    </div>

    <!-- Modal Pop-up (Disembunyikan lewat CSS murni, bukan inline style) -->
    <div id="custom-modal" class="custom-modal-overlay" role="dialog" aria-modal="true">
        <div class="custom-modal-card">
            <div class="modal-success-icon">✓</div>
            <h3>Login Berhasil!</h3>
            <p>Selamat bertugas di Front Desk,<br><strong>Resepsionis Utama</strong></p>
            <button type="button" id="modal-ok-btn" class="btn-modal-ok">Masuk ke Dashboard</button>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>

</html>
